<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Fakhir Iqbal — Web and Mobile App Developer. Press start.">
<style>
  text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace; }
  .tw { animation: tw 2.4s steps(2) infinite; }
  @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  .bob { animation: bob 1.6s steps(2) infinite; }
  .bob2 { animation: bob 1.6s steps(2) infinite .8s; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(8px) } }
  .hl { animation: hl 2s linear infinite; }
  @keyframes hl { 0% { transform: translateY(0); opacity: .9 } 100% { transform: translateY(98px); opacity: .15 } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  .in { animation: in .9s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes in { from { opacity: 0; transform: translateY(-24px) } to { opacity: 1; transform: none } }
  .scan { animation: scan 6s linear infinite; }
  @keyframes scan { from { transform: translateY(-40px) } to { transform: translateY(360px) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
